  <path d="M150 20 L264 49 L264 192 C264 264 212 312 150 340 C88 312 36 264 36 192 L36 49Z" fill="#241a0b"/>
  <path d="M150 26 L262 54 L262 190 C262 262 210 310 150 336 C90 310 38 262 38 190 L38 54Z" fill="url(#sky)"/>

