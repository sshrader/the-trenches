<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" role="img" aria-label="The Ruins">
  <defs>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9b46a"/><stop offset=".45" stop-color="#8a6a33"/><stop offset="1" stop-color="#4a3718"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f2a"/><stop offset="1" stop-color="#15180f"/>
    </linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8d8350"/><stop offset=".6" stop-color="#5d5632"/><stop offset="1" stop-color="#2e2a17"/>
    </linearGradient>
    <radialGradient id="bone" cx=".5" cy=".4" r=".7">
      <stop offset="0" stop-color="#f1e6c8"/><stop offset=".7" stop-color="#b9a679"/><stop offset="1" stop-color="#6d5f3e"/>
    </radialGradient>
    <radialGradient id="eye" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff2f0"/><stop offset=".3" stop-color="#ff5a4a"/><stop offset="1" stop-color="#9b0f0f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b4a1f"/><stop offset=".5" stop-color="#e0b25a"/><stop offset="1" stop-color="#5a3c18"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a6068"/><stop offset=".5" stop-color="#2b2f35"/><stop offset="1" stop-color="#14161a"/>
    </linearGradient>
    <clipPath id="inside"><path d="M150 26 L262 54 L262 190 C262 262 210 310 150 336 C90 310 38 262 38 190 L38 54Z"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <!-- shield: bronze rim, dark plate -->
  <path d="M150 8 L276 40 L276 192 C276 272 220 322 150 352 C80 322 24 272 24 192 L24 40Z" fill="url(#bronze)" stroke="#1b1308" stroke-width="3"/>
  <path d="M150 20 L264 49 L264 192 C264 264 212 312 150 340 C88 312 36 264 36 192 L36 49Z" fill="#241a0b"/>
  <path d="M150 26 L262 54 L262 190 C262 262 210 310 150 336 C90 310 38 262 38 190 L38 54Z" fill="url(#plate)"/>

  <g clip-path="url(#inside)">
    <!-- ruined skyline behind the hood -->
    <path d="M38 190 L38 150 L60 150 L60 128 L78 128 L78 160 L96 160 L96 120 L110 120 L110 190Z M190 190 L190 135 L206 135 L206 112 L226 112 L226 150 L244 150 L244 126 L262 126 L262 190Z" fill="#0f120a" opacity=".55"/>

    <!-- quiver and arrows, upper left -->
    <g transform="translate(14 8) rotate(-18 70 130)">
      <rect x="52" y="104" width="34" height="96" rx="5" fill="#5a3a1a" stroke="#1b1308" stroke-width="2"/>
      <rect x="52" y="140" width="34" height="8" fill="#2a1a0a"/>
      <g stroke="#1b1308" stroke-width="1.2">
        <path d="M58 104 L55 62 L61 62Z" fill="#a9a389"/><path d="M68 104 L66 52 L72 52Z" fill="#a9a389"/><path d="M78 104 L78 58 L84 58Z" fill="#a9a389"/>
      </g>
    </g>

    <!-- hood -->
    <path d="M150 52 C104 52 82 96 80 142 C79 176 88 206 104 226 L196 226 C212 206 221 176 220 142 C218 96 196 52 150 52Z" fill="url(#hood)" stroke="#1b1308" stroke-width="3"/>
    <path d="M150 52 C128 56 112 74 106 100 C122 84 138 80 150 80 C162 80 178 84 194 100 C188 74 172 56 150 52Z" fill="#a39a62" opacity=".55"/>
    <path d="M104 226 C98 250 112 266 150 270 C188 266 202 250 196 226Z" fill="#4a4426" stroke="#1b1308" stroke-width="3"/>

    <!-- face opening -->
    <path d="M150 84 C118 84 100 112 102 150 C103 182 118 206 150 214 C182 206 197 182 198 150 C200 112 182 84 150 84Z" fill="#0c0d08"/>

    <!-- skull -->
    <path d="M150 92 C122 92 108 114 110 142 C111 158 118 168 126 174 L126 196 C126 202 132 206 138 206 L162 206 C168 206 174 202 174 196 L174 174 C182 168 189 158 190 142 C192 114 178 92 150 92Z" fill="url(#bone)" stroke="#2a2210" stroke-width="2.5"/>
    <!-- eye sockets -->
    <ellipse cx="132" cy="142" rx="13" ry="14" fill="#14100a"/>
    <ellipse cx="168" cy="142" rx="13" ry="14" fill="#14100a"/>
    <!-- the red eye -->
    <circle cx="168" cy="143" r="22" fill="url(#eye)" filter="url(#soft)"/>
    <circle cx="168" cy="143" r="7" fill="#ff3b30"/><circle cx="166" cy="141" r="2.4" fill="#fff"/>
    <!-- nose and teeth -->
    <path d="M150 160 L143 176 L150 173 L157 176Z" fill="#14100a"/>
    <g fill="#e8dcb8" stroke="#2a2210" stroke-width="1.4">
      <rect x="132" y="186" width="9" height="16" rx="2"/><rect x="142" y="187" width="9" height="17" rx="2"/><rect x="152" y="187" width="9" height="17" rx="2"/><rect x="162" y="186" width="9" height="16" rx="2"/>
    </g>
    <path d="M118 150 C120 168 128 172 130 172 M182 150 C180 168 172 172 170 172" stroke="#6d5f3e" stroke-width="2" fill="none"/>

    <!-- scope, right -->
    <g transform="translate(-26 0) rotate(-8 232 176)">
      <rect x="206" y="160" width="26" height="34" rx="3" fill="url(#steel)" stroke="#0b0c0e" stroke-width="2"/>
      <rect x="226" y="150" width="40" height="54" rx="8" fill="url(#steel)" stroke="#0b0c0e" stroke-width="2.5"/>
      <ellipse cx="262" cy="177" rx="9" ry="22" fill="#0a0b0d" stroke="#3a3f46" stroke-width="2"/>
      <ellipse cx="262" cy="177" rx="5" ry="14" fill="#8b1a1a"/><ellipse cx="260" cy="170" rx="1.8" ry="4" fill="#ffb4a8"/>
      <rect x="226" y="164" width="18" height="6" fill="#6a7078" opacity=".5"/>
    </g>

    <!-- grenade, lower left -->
    <g transform="rotate(-10 78 258)">
      <rect x="70" y="212" width="16" height="12" rx="2" fill="#7a7f86" stroke="#14161a" stroke-width="2"/>
      <path d="M86 214 C100 204 112 206 114 216" stroke="#9aa0a8" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <ellipse cx="78" cy="258" rx="28" ry="34" fill="#4f6038" stroke="#14180c" stroke-width="2.5"/>
      <g stroke="#1e2a12" stroke-width="2.4" opacity=".85">
        <path d="M52 246 H104 M50 258 H106 M52 270 H104 M62 230 V288 M78 224 V292 M94 230 V288" fill="none"/>
      </g>
      <ellipse cx="66" cy="244" rx="8" ry="12" fill="#fff" opacity=".12"/>
    </g>

    <!-- bullets, lower right -->
    <g stroke="#1b1308" stroke-width="1.6">
      <g transform="translate(140 252) rotate(8)"><rect x="-6" y="-10" width="12" height="56" rx="2" fill="url(#brass)"/><path d="M-6 -10 C-6 -34 6 -34 6 -10Z" fill="#8a5a2a"/><rect x="-6" y="36" width="12" height="6" fill="#6b4a1f"/></g>
      <g transform="translate(160 248) rotate(8)"><rect x="-6" y="-10" width="12" height="56" rx="2" fill="url(#brass)"/><path d="M-6 -10 C-6 -34 6 -34 6 -10Z" fill="#8a5a2a"/><rect x="-6" y="36" width="12" height="6" fill="#6b4a1f"/></g>
      <g transform="translate(180 244) rotate(8)"><rect x="-6" y="-10" width="12" height="56" rx="2" fill="url(#brass)"/><path d="M-6 -10 C-6 -34 6 -34 6 -10Z" fill="#8a5a2a"/><rect x="-6" y="36" width="12" height="6" fill="#6b4a1f"/></g>
      <g transform="translate(200 240) rotate(8)"><rect x="-6" y="-10" width="12" height="56" rx="2" fill="url(#brass)"/><path d="M-6 -10 C-6 -34 6 -34 6 -10Z" fill="#8a5a2a"/><rect x="-6" y="36" width="12" height="6" fill="#6b4a1f"/></g>
    </g>
    <!-- strap -->
    <path d="M38 292 L262 232" stroke="#2a1a0a" stroke-width="16" opacity=".0"/>
  </g>

  <!-- star at the point -->
  <path d="M150 296 L155 309 L169 310 L158 319 L162 332 L150 324 L138 332 L142 319 L131 310 L145 309Z" fill="url(#bronze)" stroke="#1b1308" stroke-width="2"/>
  <!-- rivets -->
  <g fill="#e0b25a" stroke="#1b1308" stroke-width="1.2"><circle cx="48" cy="52" r="4"/><circle cx="252" cy="52" r="4"/><circle cx="150" cy="22" r="4"/></g>
  <path d="M150 26 L262 54 L262 190 C262 262 210 310 150 336 C90 310 38 262 38 190 L38 54Z" fill="none" stroke="#000" stroke-opacity=".55" stroke-width="2"/>
</svg>
