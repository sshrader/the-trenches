<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Two squads face off across a ruined city street at dusk, burnt-out cars and broken towers behind them">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#090c16"/><stop offset=".42" stop-color="#2a1a3a"/><stop offset=".72" stop-color="#9c3f2a"/><stop offset="1" stop-color="#f0933a"/></linearGradient>
<linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2d33"/><stop offset="1" stop-color="#0c0d10"/></linearGradient>
<radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd089" stop-opacity=".95"/><stop offset=".45" stop-color="#ff8a3a" stop-opacity=".45"/><stop offset="1" stop-color="#ff6a2a" stop-opacity="0"/></radialGradient>
<radialGradient id="fire" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd27a" stop-opacity=".9"/><stop offset="1" stop-color="#ff6a2a" stop-opacity="0"/></radialGradient>
<filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
</defs>

<rect width="1600" height="560" fill="url(#sky)"/>
<circle cx="800" cy="330" r="230" fill="url(#sun)"/>

<!-- smoke columns rising from burning blocks -->
<g fill="#1a1620" opacity=".55" filter="url(#soft)">
<ellipse cx="360" cy="150" rx="70" ry="150"/><ellipse cx="410" cy="60" rx="90" ry="70"/>
<ellipse cx="1240" cy="170" rx="60" ry="140"/><ellipse cx="1190" cy="70" rx="95" ry="65"/>
<ellipse cx="800" cy="120" rx="130" ry="50" opacity=".6"/>
</g>

<!-- far skyline, broken tops -->
<g fill="#1b1e2e">
<polygon points="0,360 0,230 60,230 60,190 120,190 120,250 190,250 190,170 230,170 250,200 250,310 320,310 320,215 390,215 400,250 400,330 470,330 470,200 520,180 540,230 540,340 620,340 620,240 700,240 700,350 780,350 780,260 840,260 840,350 910,350 910,215 960,200 980,250 980,340 1050,340 1050,185 1100,185 1100,250 1170,250 1170,330 1240,330 1240,210 1290,210 1300,240 1300,320 1380,320 1380,170 1430,150 1450,200 1450,300 1520,300 1520,240 1600,240 1600,360"/>
</g>
<!-- lit windows -->
<g fill="#ffb347" opacity=".75">
<rect x="70" y="205" width="8" height="10"/><rect x="95" y="205" width="8" height="10"/><rect x="200" y="190" width="8" height="10"/><rect x="332" y="230" width="8" height="10"/><rect x="352" y="250" width="8" height="10"/>
<rect x="480" y="215" width="8" height="10"/><rect x="1060" y="205" width="8" height="10"/><rect x="1085" y="225" width="8" height="10"/><rect x="1250" y="228" width="8" height="10"/><rect x="1390" y="190" width="8" height="10"/><rect x="1410" y="215" width="8" height="10"/>
<rect x="925" y="235" width="8" height="10"/><rect x="640" y="262" width="8" height="10"/>
</g>

<!-- nearer buildings, ruined and darker -->
<g fill="#10121b">
<polygon points="0,420 0,300 80,300 80,270 140,270 140,330 200,330 200,290 270,290 280,330 280,430"/>
<polygon points="300,430 300,350 350,330 400,350 400,310 460,310 460,360 520,360 520,430"/>
<polygon points="1080,430 1080,360 1140,360 1140,320 1200,320 1210,350 1260,350 1260,430"/>
<polygon points="1280,430 1280,320 1340,320 1340,290 1420,290 1420,330 1480,330 1480,300 1600,300 1600,430"/>
</g>
<g fill="#ff7a2e" opacity=".8"><rect x="388" y="330" width="9" height="12"/><rect x="1330" y="300" width="9" height="12"/><rect x="1380" y="312" width="9" height="12"/></g>
<!-- rooftop fires -->
<g>
<circle cx="425" cy="302" r="40" fill="url(#fire)"/><circle cx="1180" cy="312" r="36" fill="url(#fire)"/><circle cx="1448" cy="280" r="34" fill="url(#fire)"/>
</g>

<!-- the street -->
<rect y="400" width="1600" height="160" fill="url(#road)"/>
<rect y="396" width="1600" height="6" fill="#3b3f46"/>
<g fill="#d8a62a" opacity=".6">
<polygon points="40,470 120,470 112,478 32,478"/><polygon points="240,470 330,470 322,478 232,478"/><polygon points="470,470 570,470 562,478 462,478"/><polygon points="710,470 820,470 812,478 702,478"/><polygon points="960,470 1070,470 1062,478 952,478"/><polygon points="1210,470 1310,470 1302,478 1202,478"/><polygon points="1440,470 1530,470 1522,478 1432,478"/>
</g>
<g stroke="#000" stroke-opacity=".5" stroke-width="2" fill="none">
<path d="M600 420 L640 450 L630 500 L660 540"/><path d="M1000 410 L970 440 L990 480"/><path d="M180 430 L230 470 L210 520"/>
</g>

<!-- burnt-out car in the middle of the street -->
<g transform="translate(690 405)">
<ellipse cx="110" cy="95" rx="125" ry="14" fill="#000" opacity=".5"/>
<rect x="0" y="40" width="220" height="48" rx="8" fill="#5b2a2a"/>
<polygon points="40,40 70,8 150,8 185,40" fill="#2d3138"/>
<polygon points="52,38 76,14 108,14 108,38" fill="#161a20"/><polygon points="114,38 114,14 144,14 170,38" fill="#161a20"/>
<rect x="0" y="62" width="220" height="14" fill="#1a1415" opacity=".6"/>
<circle cx="52" cy="90" r="17" fill="#0a0a0a"/><circle cx="168" cy="90" r="17" fill="#0a0a0a"/><circle cx="52" cy="90" r="8" fill="#3a3c40"/><circle cx="168" cy="90" r="8" fill="#3a3c40"/>
<rect x="170" y="52" width="40" height="12" fill="#3a2316"/>
</g>

<!-- burning barrel -->
<g transform="translate(540 470)">
<circle cx="14" cy="-8" r="46" fill="url(#fire)"/>
<rect x="0" y="0" width="28" height="40" rx="4" fill="#3a3028"/><rect x="0" y="12" width="28" height="4" fill="#1a1612"/><rect x="0" y="26" width="28" height="4" fill="#1a1612"/>
<path d="M4 2 Q10 -26 14 -6 Q18 -30 24 2 Z" fill="#ff9a2e"/><path d="M9 2 Q13 -14 15 -2 Q19 -16 20 2 Z" fill="#ffe08a"/>
</g>

<!-- green survivor, crouched behind a barrier on the left, rifle aimed right -->
<g transform="translate(180 360)">
<rect x="-30" y="108" width="260" height="46" rx="6" fill="#8d8d86"/><rect x="-30" y="108" width="260" height="10" fill="#a9a9a1"/>
<g fill="#d97706"><rect x="0" y="130" width="22" height="14"/><rect x="60" y="130" width="22" height="14"/><rect x="120" y="130" width="22" height="14"/><rect x="180" y="130" width="22" height="14"/></g>
<path d="M60 112 C52 80 56 52 80 42 L118 40 C140 44 146 70 140 112 Z" fill="#3a5a40"/>
<rect x="76" y="74" width="48" height="30" rx="6" fill="#222a2e"/>
<circle cx="102" cy="26" r="21" fill="#2f3b2f"/><rect x="92" y="22" width="28" height="9" rx="3" fill="#0b1a22"/><rect x="98" y="24" width="18" height="4" fill="#67e8f9"/>
<rect x="118" y="58" width="116" height="9" rx="3" fill="#1b1d20"/><rect x="150" y="66" width="10" height="22" fill="#23262a"/><rect x="226" y="60" width="26" height="5" fill="#1b1d20"/>
<path d="M112 62 L150 62 L150 72 L116 76 Z" fill="#3a5a40"/>
</g>

<!-- red raider, crouched behind a wreck on the right, rifle aimed left -->
<g transform="translate(1420 360) scale(-1 1)">
<rect x="-30" y="108" width="260" height="46" rx="6" fill="#6b5a45"/><rect x="-30" y="108" width="260" height="10" fill="#8b7a62"/>
<rect x="20" y="124" width="70" height="20" fill="#6a7378"/><rect x="120" y="126" width="60" height="18" fill="#8b7a62"/>
<path d="M60 112 C52 80 56 52 80 42 L118 40 C140 44 146 70 140 112 Z" fill="#7a342c"/>
<rect x="76" y="74" width="48" height="30" rx="6" fill="#1d2024"/>
<circle cx="102" cy="26" r="22" fill="#25282c"/><path d="M80 30 Q60 36 56 56 Q76 50 86 40 Z" fill="#b91c1c"/><rect x="90" y="24" width="30" height="13" rx="3" fill="#b91c1c"/><rect x="94" y="19" width="22" height="5" fill="#111"/>
<rect x="118" y="58" width="116" height="9" rx="3" fill="#1b1d20"/><rect x="150" y="66" width="10" height="22" fill="#23262a"/><rect x="226" y="60" width="26" height="5" fill="#1b1d20"/>
<path d="M112 62 L150 62 L150 72 L116 76 Z" fill="#7a342c"/>
</g>

<!-- grit -->
<g fill="#000" opacity=".25"><rect y="540" width="1600" height="20"/></g>
</svg>
